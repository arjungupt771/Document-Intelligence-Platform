name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docint
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: document_intelligence_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql+psycopg2://docint:test-password@localhost:5432/document_intelligence_test
      QDRANT_URL: http://localhost:6333
      API_AUTH_KEY: ${{ secrets.CI_TEST_API_KEY || 'ci-test-key-1234567890123456789012' }}
      LLM_URL: https://api.groq.com/openai/v1
      LLM_MODEL: openai/gpt-oss-120b
      LLM_API_KEY: ci-dummy-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70 -m "not integration"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with: { name: coverage-report, path: .coverage }

  security:
    uses: ./.github/workflows/security-scan.yml   # reuses the 16.16 workflow — one definition, called from CI