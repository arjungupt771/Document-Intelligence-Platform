server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 10 MB by the API; leave headroom for multipart overhead.
    client_max_body_size 12m;

    # Static single-page app (HashRouter, so no rewrite rules are needed).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the FastAPI container: the browser only ever talks to
    # this host, so no CORS is involved. The trailing slash strips the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /documents/{id}/process can be slow the first time (embedding model load)
        # and /qa/answer waits on the LLM.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}